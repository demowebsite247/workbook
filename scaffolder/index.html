const L=[
["intro","স্ক্যাফোল্ড কী? (পরিচিতি)","<p><b>স্ক্যাফোল্ড (Scaffold)</b> মানে ভারা বা মাচা। উঁচুতে কাজ করার জন্য পাইপ আর পাট্টা দিয়ে বানানো অস্থায়ী কাঠামো।</p><p>যে ভাই এটা বানায়, বদলায় আর খোলে, তাকে বলে <b>স্ক্যাফোল্ডার (Scaffolder)</b>।</p><p><b>কোথায় লাগে:</b> বিল্ডিং, প্লান্ট, ট্যাংক, পাইপলাইন, শাটডাউনের কাজে।</p><p><b>বিপদ কী কী:</b> উপর থেকে পড়ে যাওয়া, উপর থেকে জিনিস পড়া, ভেঙে পড়া, কারেন্টের শক।</p>"],
["types","স্ক্যাফোল্ডের কত রকম","<p><b>পাইপ-ক্ল্যাম্প (Tube & Coupler):</b> পাইপ আর ক্ল্যাম্প দিয়ে, যেকোনো আকারে বানানো যায়।<br><b>কাপলক / রিংলক:</b> রেডিমেড সিস্টেম, তাড়াতাড়ি লাগে।<br><b>ফ্রেম (Frame):</b> তৈরি ফ্রেম বসাও।<br><b>মোবাইল টাওয়ার:</b> চাকা লাগানো, ঠেলে নেওয়া যায়।<br><b>সাসপেন্ডেড:</b> উপর থেকে ঝোলানো।<br><b>ক্যান্টিলিভার, ট্রেসেল, বার্ডকেজ</b> ও আছে।</p><p class=m>কোনটার কত লোড, কত উচ্চতা — কোম্পানির নিয়ম আর কারখানার কাগজ দেখে ঠিক হয়।</p>"],
["parts","স্ক্যাফোল্ডের অংশ (পার্টস)","PARTS"],
["pipe","পাইপ ও পাট্টার লম্বা, মোটা, ওজন","PIPE"],
["coupler","ক্ল্যাম্প (কাপলার)",`<p>সাইটে কাপলারকে বলে <b>ক্ল্যাম্প (Clamp)</b>। ৮ রকম ক্ল্যাম্প:</p><ol><li><b>Right Angle Coupler (রাইট অ্যাঙ্গেল)</b> — <span class=tag>ডাবল ক্ল্যাম্প</span> ৯০° কোণে দুই পাইপ জোড়ে। standard আর ledger জোড়ায় বেশি লাগে।</li><li><b>Swivel Coupler (সুইভেল)</b> — <span class=tag>সুইভেল ক্ল্যাম্প</span> যেকোনো কোণে ঘুরিয়ে জোড়ে। ব্রেসে লাগে।</li><li><b>Sleeve Coupler (স্লিভ)</b> — <span class=tag>স্লিভ ক্ল্যাম্প</span> দুই পাইপ সোজা লম্বা করে জোড়ে।</li><li><b>Putlog Coupler (পাটলগ)</b> — <span class=tag>সিঙ্গেল ক্ল্যাম্প</span> এক পাইপের সাথে আরেকটা আটকায়, ট্রান্সম ধরতে লাগে।</li><li><b>Board Retaining Coupler (বোর্ড রিটেইনিং)</b> — <span class=tag>পাট্টা ক্ল্যাম্প</span> পাট্টা নড়া বা সরে যাওয়া ঠেকায়।</li><li><b>Girder Coupler (গার্ডার)</b> — <span class=tag>বিম ক্ল্যাম্প</span> লোহার বিমের সাথে পাইপ জোড়ে।</li><li><b>Parallel Coupler (প্যারালাল)</b> — <span class=tag>প্যারালাল ক্ল্যাম্প</span> পাশাপাশি দুই পাইপ একসাথে ধরে।</li><li><b>Toe Board Clip (টো বোর্ড ক্লিপ)</b> — <span class=tag>কিক পাট্টা ক্ল্যাম্প</span> কিক পাট্টা পাইপের সাথে আটকে রাখে।</li></ol><p>ব্যবহারের আগে ক্ল্যাম্প ভাঙা, ফাটা বা মরিচা ধরা আছে কিনা দেখো। নাট ভালো করে টাইট দাও।</p><p class=m>সাইটের নাম এলাকা ভেদে আলাদা হতে পারে। আপনার সাইটে যে ৮টা বলে সেটা জানালে মিলিয়ে দিব।</p>`],
["erect","স্ক্যাফোল্ড বানানোর ধাপ","<ol><li>জায়গা দেখো, ঝুঁকি বুঝে নাও</li><li>পারমিট (PTW) আছে কিনা দেখো</li><li>মাটি সমান করো, সোল বোর্ড আর বেস প্লেট বসাও</li><li>স্ট্যান্ডার্ড দাঁড় করাও, তারপর লেজার, ট্রান্সম</li><li>ব্রেস আর টাই দাও</li><li>পাট্টা (বোর্ড) বিছাও, গার্ডরেইল, মিডরেইল, টো বোর্ড লাগাও</li><li>ওঠার সিঁড়ি দাও</li><li>ইন্সপেকশন করে ট্যাগ লাগাও</li></ol>"],
["load","ওজন (লোড) আর হিসাব","LOAD"],
["inspect","চেক করা আর ট্যাগ","INSP"],
["safety","সেফটি, PPE আর পারমিট","<p><b>PPE:</b> হেলমেট, সেফটি জুতা, গ্লাভস, চশমা, হাই-ভিস জ্যাকেট, আর সেফটি বেল্ট (ফুল বডি হারনেস) সঙ্গে শক অ্যাবজর্বার লেনইয়ার্ড।</p><p>পারমিট (PTW), JSA আর টুলবক্স টক (TBT) ছাড়া কাজ শুরু করবে না। উঁচুতে কাজে বেল্ট সবসময় হুকে লাগাও।</p><p class=m>OSHA আর আপনার কোম্পানির সাইট নিয়ম (আরামকো সাইটে তাদের নিয়ম) দেখে চলতে হবে। এক কোম্পানির নিয়ম সব জায়গায় চলে না।</p>"],
["aramco","আরামকো নিয়ম — সারসংক্ষেপ",`<p class=m>সূত্র: Saudi Aramco GI 8.001 (ইস্যু ২৮/০৬/২০০৪)। এটা পুরনো কপি, নতুন সংস্করণ বা সাইটের নিয়ম আছে কিনা দেখে নিবে।</p>
<h4>🏷️ ট্যাগ (৩ রঙ)</h4>
<p><span class=tag style="background:#d33">লাল</span> পরীক্ষা হয়নি বা নিরাপদ না। <b>ব্যবহার করবে না</b> (শুধু স্ক্যাফোল্ডাররা বানানো/খোলা/ঠিক করার কাজে উঠবে)।<br><span class=tag style="background:#2a9d4a">সবুজ</span> পুরা হয়েছে, চেক হয়েছে, নিরাপদ। <b>সর্বোচ্চ ২ সপ্তাহ</b> চলে।<br><span class=tag style="background:#d9a400">হলুদ</span> শুধু ঠিকমতো আটকানো <b>ফুল বডি হারনেস + লেনইয়ার্ড</b> পরে ওঠা যাবে। গার্ডরেইল বা পাট্টা বাধার কারণে লাগানো না গেলে বা সাময়িক খুলতে হলে লাগে। <b>সর্বোচ্চ ২ সপ্তাহ</b>। ইচ্ছা করে অসম্পূর্ণ বানানো চলবে না।</p>
<p>🚫 স্ট্যান্ডার্ড, লেজার, ট্রান্সম বা ব্রেস না থাকলে সবুজ/হলুদ কোনোটাই দেওয়া যাবে না।<br>🔴 বানানো, বদলানো, ঠিক করা বা খোলার সময় প্রতিটা ওঠার জায়গায় লাল ট্যাগ থাকবে। লাল ট্যাগ খুলতে পারবে শুধু স্ক্যাফোল্ড সুপারভাইজার বা ইন্সপেক্টর। হোল্ডার পাইপ ঢুকিয়ে আটকাবে, তার/সুতা দিয়ে বাঁধবে না।<br>✍️ সবুজ/হলুদ ট্যাগে সই করবে সার্টিফায়েড সুপারভাইজার (পারমানেন্ট ইংক কলম দিয়ে)। ট্যাগ ভিতরে ঠেলে দিবে যেন লাল "Do Not Use" ঢাকা পড়ে। ট্যাগ খুলে অন্য জায়গায় লাগানো নিষেধ।</p>
<h4>📏 উচ্চতা অনুযায়ী নিয়ম</h4>
<table><tr><th>উচ্চতা</th><th>স্ক্যাফোল্ড প্ল্যান</th><th>চেক ও সই</th></tr><tr><td>১.৮ m এর নিচে (স্থির)</td><td>লাগে না, ট্যাগও লাগে না*</td><td>—</td></tr><tr><td>০–৬ m</td><td>না</td><td>শুধু সুপারভাইজার</td></tr><tr><td>৬–১২.২ m</td><td>না</td><td>সুপারভাইজার + ইন্সপেক্টর</td></tr><tr><td>১২.২–৩৮ m</td><td>হ্যাঁ (Proponent ও LPD দেখবে)</td><td>সুপারভাইজার + ইন্সপেক্টর</td></tr><tr><td>৩৮ m এর উপরে / Special</td><td>হ্যাঁ (CSD ও দেখবে)</td><td>সুপারভাইজার + ইন্সপেক্টর</td></tr></table><p class=m>*কিনারার কাছে ১.৮ m এর বেশি পড়ার ঝুঁকি থাকলে নিয়ম প্রযোজ্য। ১২.২ m এর উপরে আর Special স্ক্যাফোল্ড বানাবে শুধু অনুমোদিত Specialized Scaffolding Contractor।</p>
<h4>⭐ Special স্ক্যাফোল্ড কোনগুলো</h4>
<p>৩৮ m এর বেশি উঁচু • ৩ m এর বেশি বাইরে বেরোনো (ক্যান্টিলিভার) • ৩০ m² এর বেশি প্ল্যাটফর্ম, বিদ্যমান কাঠামো থেকে সাপোর্ট বা ঝোলানো • ২৪০ kg/m² এর বেশি লোড • আউটরিগার বিম থেকে ঝোলানো বা সাপোর্ট • ফ্লোটিং রুফ ট্যাংকের ওয়াইন্ড গার্ডার বা ছাদ থেকে ঝোলানো • টিউব-কাপলার যা SSH এর সীমা ছাড়িয়েছে।</p>
<h4>🦺 কাজের সময়</h4>
<p>বানানো, বদলানো বা খোলার সময় স্ক্যাফোল্ডার সবসময় <b>ফুল বডি হারনেস + শক অ্যাবজর্বিং লেনইয়ার্ড</b> পরবে। গার্ডরেইল না থাকলে আর ১.৮ m (৬ ফুট) এর বেশি পড়ার ঝুঁকি থাকলে সম্ভব হলে লেনইয়ার্ড আটকাবে (শক্ত অ্যাঙ্কর না থাকলে স্ক্যাফোল্ডে)।<br>নষ্ট বা দুর্বল মালামাল <b>উজ্জ্বল কমলা রঙ</b> দিয়ে চিহ্নিত করে সাইট থেকে সরিয়ে ফেলবে, আর ব্যবহার করবে না।</p>
<h4>🔍 চেক করার নিয়ম</h4>
<p>• বানানো শেষে সুপারভাইজার নিজে চেকলিস্ট ভরে চেক করবে। সবুজ/হলুদ ট্যাগে <b>পরের চেকের তারিখ</b> লিখবে, ২ সপ্তাহের বেশি না।<br>• প্রতি <b>২ সপ্তাহে</b> আবার চেক।<br>• <b>প্রতি শিফটের আগে</b> কাজের সুপারভাইজার (Work Permit Receiver) আর Work Permit Issuer প্রি-ইউজ চেক করবে। ট্যাগের উল্টা পিঠে "Scaffold User's Safety Checklist" আছে।<br>• ট্যাগ নেই, লাল, বা তারিখ পার — Work Permit দেওয়া যাবে না। ট্যাগ খুলে লাল লাগিয়ে সাথে সাথে Issuer কে জানাবে, কাজ বন্ধ।<br>• হলুদ ট্যাগ হলে পারমিটে লেখা থাকবে হারনেস লাগবেই।</p>
<h4>🔧 বদলানো আর খোলা</h4>
<p>বদলানো বা ঠিক করবে শুধু মূল ইরেক্টরের স্ক্যাফোল্ডার, সুপারভাইজারের তত্ত্বাবধানে (গার্ডরেইল, পাট্টা, সিঁড়িও)। বদলের পর আবার চেক আর নতুন ট্যাগ।<br>খোলার আগে সব সবুজ/হলুদ ট্যাগ সরিয়ে লাল ট্যাগ। খোলা হবে <b>উপর থেকে নিচে, ধাপে ধাপে</b>। মালামাল দড়ি দিয়ে নামাবে, <b>ছুঁড়ে ফেলবে না</b>। শেষে ঠিক জায়গায় সাজিয়ে রাখবে।</p>
<h4>🪪 সার্টিফিকেট</h4>
<p><b>Supervisor I:</b> সব স্ক্যাফোল্ড (কমপক্ষে ৫ বছর অভিজ্ঞতা)।<br><b>Supervisor II-T:</b> শুধু টিউব-কাপলার, ১২.২ m এর নিচে (৩ বছর)।<br><b>Supervisor II-S:</b> শুধু সিস্টেম/ফ্রেম, ১২.২ m এর নিচে (৩ বছর)।<br><b>Inspector:</b> সব চেক করতে পারে, কিন্তু বানানোর তত্ত্বাবধান করতে পারে না। একই ট্যাগে সুপারভাইজার আর ইন্সপেক্টর দুই জায়গায় সই করতে পারে না।<br>পকেট কার্ড সবসময় সাথে রাখবে। মেয়াদ ৩ বছর, তারপর আবার পরীক্ষা। সুপারভাইজার ও ইন্সপেক্টরকে ইংরেজি পড়া-বলা জানতে হবে। সাধারণ স্ক্যাফোল্ডাররা ট্রেইনড হতে হবে, তবে Aramco সার্টিফায়েড লাগে না।</p>`],
["aramcofull","আরামকো GI 8.001 — সম্পূর্ণ নিয়ম",`<div><p class=m>সূত্র: Saudi Aramco GI 8.001 (ইস্যু ২৮/০৬/২০০৪, আগের ১৫/০৯/২০০৩)। বাংলায় সহজ করে লেখা। ব্র্যাকেটে অনুচ্ছেদ নম্বর আছে, আসল কাগজের সাথে মিলিয়ে নিতে পারবে। এটা পুরনো কপি, নতুন সংস্করণ বা SSH এর বিস্তারিত সীমা (যেমন Section 9.11) সাইটের আসল কাগজে দেখে নিবে।</p><details class=card><summary><b>১. উদ্দেশ্য (1.0)</b></summary><p>সৌদি আরামকোর সব অনশোর ও অফশোর সাইট ও প্রজেক্টে স্থির ও মোবাইল স্ক্যাফোল্ডের ডিজাইন, বানানো, তত্ত্বাবধান, চেক, ব্যবহার, বদল আর খোলার <b>ন্যূনতম নিয়ম</b>। ঠিকাদার বানাক বা আরামকোর নিজের বিভাগ, নিয়ম একই।</p></details><details class=card><summary><b>২. সংজ্ঞা (2.0)</b></summary><p><b>Guardrails:</b> টপ রেইল + মিড রেইল।<br><b>Lanyard:</b> লক হওয়া হুকসহ দড়ি যা হারনেসকে অ্যাঙ্কর বা লাইফলাইনে বাঁধে। <b>Shock-absorbing Lanyard</b> পড়ার ধাক্কা অনেক কমায়।<br><b>Personal Fall Arrest System:</b> শক্ত অ্যাঙ্কর + ফুল বডি হারনেস + লেনইয়ার্ড (সাথে ডিসিলারেশন ডিভাইস/লাইফলাইন থাকতে পারে)।<br><b>Platform:</b> এক বা একাধিক Platform Unit (কাঠের পাট্টা, ফেব্রিকেটেড পাট্টা/ডেক) + গার্ডরেইল।<br><b>Point of Access:</b> স্ক্যাফোল্ডে ওঠার প্রথম ধাপ (সিঁড়ি ইত্যাদি)। ভিতরের উপরের সিঁড়ি Point of Access না।<br><b>Mobile Scaffold:</b> চাকা (কাস্টার) লাগানো, হাতে সমতলে ঠেলা যায়।<br><b>Bracket (Tank Builder’s):</b> ট্যাংক/ভেসেলের দেয়ালে ওয়েল্ড করা স্ট্র্যাপে ব্র্যাকেট ঝুলিয়ে।<br><b>Fabricated Tubular Frame:</b> তৈরি এন্ড ফ্রেমের উপর প্ল্যাটফর্ম।<br><b>System Scaffold:</b> ফিক্সড কানেকশন পয়েন্টের standard-এ runner (ledger), bearer (transom), brace লাগে।<br><b>Tube & Coupler:</b> স্টিল টিউব (standard, runner, bearer, brace, tie) + বেস + বিশেষ কাপলার।<br><b>Structural Alteration:</b> লোড বা স্থিতি ধরা কাঠামোর বিন্যাস বদলানো।<br><b>Proponent:</b> যে আরামকো সংস্থা ওই সুবিধা/ভবন চালায়; ক্যাপিটাল প্রজেক্টে সুবিধার মালিক, নতুন প্রজেক্টে বাস্তবায়নকারী সংস্থা।<br><b>Qualified Structural Engineer:</b> Specialized Contractor-এর সিভিল/স্ট্রাকচারাল ডিগ্রিধারী অভিজ্ঞ ইঞ্জিনিয়ার।<br><b>Scaffold Craftsmen (Scaffolders):</b> Erector-এর কর্মী, সুপারভাইজারের অধীনে বানায়/বদলায়/খোলে। ট্রেইনড ও যোগ্য হতে হবে, কিন্তু আরামকো সার্টিফায়েড লাগে না।<br><b>Scaffold Erector:</b> যে সংস্থা ডিজাইন, বানানো, বদল ও খোলার দায়িত্বে (আরামকোর রক্ষণাবেক্ষণ বিভাগ বা বাইরের ঠিকাদার)।<br><b>Scaffold Inspector:</b> আরামকো বা ঠিকাদারের কর্মী, ঝুঁকি চিনে মান যাচাই করে ফল লেখে। সবাই আরামকো সার্টিফায়েড।<br><b>Scaffold Supervisor:</b> Erector-এর ফুল-টাইম কর্মী, এলাকার স্ক্যাফোল্ডারদের সরাসরি সুপারভাইজার। সবাই আরামকো সার্টিফায়েড।<br><b>Scaffold Plan:</b> ড্রয়িং, ডিজাইন লোড, মালামালের স্পেক ও সাইজ, কাপলার/ফিটিংসের নির্মাতার টেকনিক্যাল ডেটা, আর Special হলে স্ট্রাকচারাল হিসাব।<br><b>Specialized Scaffolding Contractor:</b> যার একমাত্র ব্যবসা স্ক্যাফোল্ড ডিজাইন ও বানানো, আরামকো অনুমোদিত। General Bid Slate (GBS) এর ঠিকাদাররা অনুমোদিত; অন্যদের (non-GBS) আবেদন পর্যালোচনায় কমপক্ষে ৩ মাস লাগে।</p><p><b>চেকলিস্ট ফর্ম:</b> Form 9613 = Scaffold Plan Completeness। 9614 = Base-Supported Non-Movable। 9615 = Mobile। 9616 = Underhung (ঝোলানো)। 9617 = Bracket (Tank Builder’s)। সার্টিফায়েডরা Blue Book এর "Scaffold Field Inspection Checklist" ও ব্যবহার করতে পারে (Erector দিবে)। ট্যাগের উল্টা পিঠে <b>Scaffold User’s Safety Checklist</b>।<br><b>সংক্ষেপ:</b> ALPD = Area Loss Prevention Division, CSD = Consulting Services Dept, CSM = Construction Safety Manual, GBS, GES = General Engineering Services (ডিজাইন কনসাল্টেন্ট), LPD = Loss Prevention Dept, PMT, PPE, SSCET = Specialized Scaffolding Contractor Evaluation Team, SSH = Scaffold Safety Handbook, T&CD = Training & Career Development।</p></details><details class=card><summary><b>৩. সাধারণ নিয়ম (3.0)</b></summary><p>• সব কাজ এই GI, আরামকো <b>Scaffold Safety Handbook (SSH)</b> আর <b>Construction Safety Manual (CSM)</b> মানতে হবে। SSH পুরনো CSM (১৯৯৩ বা আগের) এর বদলে চলবে।<br>• সব স্ক্যাফোল্ড কাজের প্রবাহ (Workflow) মেনে হবে: প্ল্যান রিভিউ, ইন্সপেকশন, ট্যাগ ইত্যাদি। <b>ব্যতিক্রম:</b> স্থির, বেস-সাপোর্টেড, ১.৮ m (৬ ফুট) এর নিচে স্ক্যাফোল্ড লাগে না, যদি না উঁচু কাঠামোর কিনারায় ১.৮ m এর বেশি পড়ার ঝুঁকি থাকে।<br>• ১ জুলাই ২০০৩ থেকে Special আর ১২.২ m (৪০ ফুট) এর উপরের স্ক্যাফোল্ড শুধু অনুমোদিত Specialized Scaffolding Contractor ডিজাইন, বানানো, বদল, ইন্সপেকশন ও খোলা করতে পারবে। (আরামকোর অফশোর রক্ষণাবেক্ষণ সংস্থা দূরবর্তী অফশোর প্ল্যাটফর্মে নিজেদের কাজে এটা করতে পারে।)<br>• GBS এর বাইরের Specialized ঠিকাদার আরামকোর ভিতরে শুধু নিজের কাজে (ভাড়ায় নয়), নিজের লোক ও মালামাল দিয়ে বানাতে পারে।<br>• ১২.২ m বা নিচের স্ক্যাফোল্ডে Proponent ঠিক করে আরামকোর নিজের দল না বাইরের ঠিকাদার।</p></details><details class=card><summary><b>৪. স্ক্যাফোল্ড প্ল্যান তৈরি ও রিভিউ (4.0)</b></summary><p>• প্ল্যান লাগে: ১২.২ m এর উপরে, সব Special, বা Loss Prevention চাইলে।<br>• Specialized ঠিকাদার প্ল্যান বানিয়ে <b>Plan Completeness Checklist (Form 9613)</b> ভরে সংযুক্ত করবে, তারপর Proponent এর কাছে দিবে।<br>• Special এর প্ল্যান <b>Qualified Structural Engineer</b> চেক করে সই করবে। বিদ্যমান কাঠামোর উপর ভর করলে সাপোর্ট রিঅ্যাকশন (বাতাসসহ) বের করে Proponent কে দিবে।<br>• চুক্তি এই GI এর পরে হলে Special এর হিসাব আরামকো অনুমোদিত স্বাধীন GES কনসাল্টেন্ট বা LSTK ঠিকাদারের স্ট্রাকচারাল গ্রুপ করবে, SSH Addendum #2 এর ডিজাইন নিয়মে।<br>• Proponent প্ল্যান পূর্ণতা, কাজের উপযোগিতা, প্রবেশ ও ক্লিয়ারেন্স দেখে LPD তে পাঠাবে। বিদ্যমান কাঠামো লোড নিতে পারবে কিনা (বাতাসের লোডসহ) আর শোরিং লাগবে কিনা তা Proponent এর ইঞ্জিনিয়ারিং সংস্থা নিশ্চিত করবে।<br>• Proponent প্ল্যান ALPD অফিসে জমা দিবে বানানোর <b>কমপক্ষে ২ সপ্তাহ আগে</b> (Special হলে <b>৪ সপ্তাহ</b> আগে)।<br>• ALPD সব তথ্য ঠিক থাকলে <b>১ সপ্তাহে</b> রিভিউ শেষ করে। ত্রুটি থাকলে ঠিক করে আবার পাঠাতে হয়।<br>• Special হলে ALPD এর পর <b>CSD Civil Engineering Unit</b> রিভিউ করে (সব ঠিক থাকলে <b>২ সপ্তাহে</b>)। অসম্পূর্ণ বা অস্পষ্ট প্ল্যান ফেরত আসে।<br>• চূড়ান্ত অনুমোদিত প্ল্যানের কপি ALPD কে দিতে হয়। Proponent ভবিষ্যতের মডেল হিসেবে ফাইলে রাখবে।</p></details><details class=card><summary><b>৫. স্ক্যাফোল্ড বানানো (5.0)</b></summary><p>• শুরুর আগে Work Permit Issuer ও Scaffold Supervisor সাইট ঘুরে ঝুঁকি কমাবে: আবর্জনা, উপরের পাওয়ার লাইন, বৈদ্যুতিক তার, খাদ, রাস্তা ইত্যাদি। প্ল্যান লাগলে Issuer নিশ্চিত করবে প্ল্যান বানানো ও LP রিভিউ হয়েছে, তবেই পারমিট।<br>• সুপারভাইজার মালামাল <b>বানানোর আগে, বানানোর সময় ও পরে</b> চেক করবে: SSH মেনেছে, ভালো অবস্থায়, ত্রুটিহীন। নষ্ট, দুর্বল বা মানহীন যেকোনো অংশ <b>উজ্জ্বল ফ্লুরোসেন্ট কমলা রঙে</b> চিহ্নিত করে সাথে সাথে আরামকোর সম্পত্তি থেকে সরাবে ও নষ্ট করে ফেলবে, যেন আর ব্যবহার না হয়।<br>• প্ল্যান থাকলে হুবহু অনুমোদিত প্ল্যান অনুযায়ী বানাবে। বদল লাগলে আগে ALPD (Special হলে CSD) রিভিউ।<br>• বানানো, বদল ও খোলা হবে শুধু <b>সাইটে উপস্থিত Scaffold Supervisor</b> এর নির্দেশে, যিনি Erector এর কর্মী। শেষে এসে শুধু ট্যাগে সই করা চলবে না। শুধু ট্রেইনড ও অভিজ্ঞ স্ক্যাফোল্ডার কাজ করবে।<br>• বানানো/বদল/খোলার সময় স্ক্যাফোল্ডার <b>সবসময় ফুল বডি হারনেস + শক-অ্যাবজর্বিং লেনইয়ার্ড</b> পরবে। গার্ডরেইল না থাকলে আর ১.৮ m (৬ ফুট) এর বেশি পড়ার ঝুঁকি থাকলে সম্ভব হলে লেনইয়ার্ড ঠিকমতো আটকাবে (শক্ত অ্যাঙ্কর না থাকলে তবেই স্ক্যাফোল্ডে)।<br>• সবসময় লাল, সবুজ বা হলুদ ট্যাগ থাকবে। বানানো/বদল/মেরামত/খোলার পুরো সময় প্রতিটা Point of Access এ <b>লাল "Do Not Use" ট্যাগ</b>। লাল ট্যাগ খুলতে পারে শুধু সুপারভাইজার বা ইন্সপেক্টর। লাল হোল্ডার পাইপ ঢুকিয়ে আটকাবে, তার বা সুতা দিয়ে বাঁধা যাবে না।</p></details><details class=card><summary><b>৬. প্রথম ইন্সপেকশন ও ট্যাগ (6.0)</b></summary><p>• লাল ট্যাগের স্ক্যাফোল্ডে শুধু স্ক্যাফোল্ডাররা বানানো/খোলা/বদল/ত্রুটি ঠিক করার কাজে উঠবে। অন্য কেউ উঠলে সে ও তার সুপারভাইজার শাস্তির আওতায়।<br>• বানানো শেষে সুপারভাইজার <b>নিজে</b> যত দ্রুত সম্ভব ইন্সপেক্ট করবে (অন্য কেউ ওঠার আগে) এবং চেকলিস্ট ভরে সই করবে।<br>• সবুজ ("Passed Inspection") ও হলুদ ("Full Body Harness Required") ট্যাগে সই করবে সার্টিফায়েড সুপারভাইজার, ট্যাগের "Scaffold Supervisor" ঘরে। <b>৬ m (২০ ফুট) বা নিচে, Special না</b>: শুধু সুপারভাইজার সই করে, "Date of Next Inspection" লেখে (২ সপ্তাহের বেশি না), আর নিজের সই করা ট্যাগ আগের হোল্ডারে ঢোকায়।<br>• <b>৬ m এর উপরে ও Special</b>: সুপারভাইজারের পর <b>সার্টিফায়েড ইন্সপেক্টর</b> (সে ওই স্ক্যাফোল্ডের সুপারভাইজার নয়) আলাদা চেকলিস্ট ভরে ইন্সপেকশন করবে, একই ট্যাগে "Scaffold Inspector" ঘরে সই করবে, পরের ইন্সপেকশনের তারিখ লিখবে (২ সপ্তাহের বেশি না) এবং দুজনের সই করা ট্যাগ হোল্ডারে ঢোকাবে।<br>• প্রতি ইন্সপেকশনের পর সই করা চেকলিস্ট Work Permit Issuer এর ইউনিট বা আরামকো প্রজেক্ট সাইট অফিসে জমা, স্ক্যাফোল্ড খোলা পর্যন্ত ফাইলে থাকবে।<br>• ৬ m এর উপরে/Special স্ক্যাফোল্ড সুপারভাইজার ও ইন্সপেক্টর দুজনের সই ছাড়া লাল ছাড়া অন্য ট্যাগ বা অন্যদের ব্যবহার চলবে না।<br>• <b>হলুদ ট্যাগ:</b> যেখানে ব্যাঘাতের কারণে সব গার্ডরেইল বা পাট্টা লাগানো যায় না। কিন্তু <b>bearer, runner, post বা brace না থাকলে</b> কখনোই হলুদ বা সবুজ নয়। ইচ্ছা করে অসম্পূর্ণ বানানো চলবে না।<br>• ভুল বা অনিরাপদ মনে হলে সুপারভাইজার/ইন্সপেক্টর সই করবে না। অন্য কেউ না জানিয়ে বদল করলে তারা দায়ী নয়।<br>• সবুজ/হলুদ ট্যাগ হোল্ডারে পুরো ঢুকিয়ে লাল "Do Not Use" লেখা ঢেকে ফেলবে, সইসহ সামনের দিক সবসময় দেখা যাবে। শুধু <b>পারমানেন্ট ইংক কলম</b> ব্যবহার, মেয়াদ সর্বোচ্চ ২ সপ্তাহ।<br>• ট্যাগ খোলার আগে স্ক্যাফোল্ড না খুলে ট্যাগ সরানো বা অন্য জায়গায় ব্যবহার নিষেধ। অনুমতি ছাড়া সরালে বা বদলালে শাস্তি।<br>• <b>ট্যাগের আসল মালামাল:</b> শুধু আরামকো অনুমোদিত সরবরাহকারীর আসল ট্যাগ। SAP নম্বর: লাল হোল্ডার 1000123277, সবুজ ইনসার্ট 1000123290, হলুদ ইনসার্ট 1000123293, পারমানেন্ট ইংক কলম 1000123296। Proponent ট্যাগ সরবরাহ করে (চুক্তিতে অন্যরকম থাকলে Erector কিনবে)।</p></details><details class=card><summary><b>৭. বদল (7.0)</b></summary><p>• বদল বা মেরামত করবে শুধু স্ক্যাফোল্ডাররা, যে Erector মূল স্ক্যাফোল্ড বানিয়েছে তার সুপারভাইজারের সরাসরি তত্ত্বাবধানে (গার্ডরেইল, পাট্টা, সিঁড়িও)।<br>• প্রতি বদলের পর সুপারভাইজার (প্রয়োজনে ইন্সপেক্টরসহ) আবার ইন্সপেক্ট করবে। নিরাপদ হলে নতুন সই করা সবুজ/হলুদ ট্যাগ লাগিয়ে তবে আবার ব্যবহার।<br>• সুপারভাইজার বা Erector এর কেউ নিজের মতে অনিরাপদ বদল করতে বাধ্য না।</p></details><details class=card><summary><b>৮. নিয়মিত ইন্সপেকশন (8.0)</b></summary><p>• <b>অন্তত প্রতি ২ সপ্তাহে</b> মূল Erector এর সুপারভাইজার (প্রয়োজনে ইন্সপেক্টরসহ) আবার চেক করবে অনিয়মিত বদল হয়েছে কিনা। ঠিক থাকলে নতুন সবুজ/হলুদ ট্যাগ (সর্বোচ্চ ২ সপ্তাহ)। বদল বা অনিরাপদ হলে লাল ট্যাগ, অথবা সাথে সাথে ঠিক করে নতুন ট্যাগ।<br>• <b>প্রতি শিফটের প্রথম ব্যবহারের আগে</b> স্ক্যাফোল্ড ব্যবহারকারী কর্মীদের সুপারভাইজার (সাধারণত Work Permit Receiver) আর Work Permit Issuer (বা তার প্রতিনিধি; GI 2.100 Work Permit System অনুযায়ী যৌথ পরিদর্শন লাগলে) প্রি-ইউজ ইন্সপেকশন করবে: অনিয়মিত বদল নেই, বড় ত্রুটি নেই, সবুজ/হলুদ ট্যাগ আছে ও মেয়াদ আছে। ট্যাগের উল্টা পিঠের User’s Safety Checklist ব্যবহার করবে।<br>• অনিরাপদ বা মেয়াদ ফুরানো ট্যাগ পেলে: সবুজ/হলুদ ট্যাগ সরিয়ে <b>লাল ট্যাগ</b>, সাথে সাথে Proponent/Work Permit Issuer কে জানাবে যেন পারমিট বাতিল ও ত্রুটি ঠিক হয়। ঠিক না হওয়া পর্যন্ত কাজ বন্ধ।<br>• Work Permit Issuer পারমিট দিবে না (স্ক্যাফোল্ডার ছাড়া) যদি: অনিরাপদ, ট্যাগ নেই, লাল ট্যাগ, বা ট্যাগের তারিখ পার। হলুদ ট্যাগ বৈধ হলে পারমিটে লিখবে সবসময় ঠিকমতো আটকানো ফুল বডি হারনেস লাগবে।<br>• আরামকো LPD এলাকা অফিস মাঝেমধ্যে র‍্যান্ডম পরিদর্শন করে।</p></details><details class=card><summary><b>৯. খোলা (9.0)</b></summary><p>• ব্যবহার শেষে আর কারো লাগবে না নিশ্চিত হলে Proponent সব সবুজ/হলুদ ট্যাগ খুলে প্রতিটা Point of Access এ লাল ট্যাগ লাগাবে এবং সাথে সাথে Erector কে জানাবে।<br>• Erector যত দ্রুত সম্ভব খুলবে।<br>• সুপারভাইজার নিশ্চিত করবে খোলা <b>পরিকল্পিত, গোছানো, উপর থেকে নিচে ধাপে ধাপে</b>। অংশ, যন্ত্র ও ফিটিংস দড়ি ইত্যাদি দিয়ে নামাবে, <b>ছুঁড়ে ফেলবে না</b>। খোলার পরই মালামাল নির্দিষ্ট স্টোরেজে ঠিকমতো সাজিয়ে রাখবে।</p></details><details class=card><summary><b>১০. কার কী দায়িত্ব (10.0)</b></summary><p><b>CSD:</b> সব Special স্ক্যাফোল্ডের প্ল্যান ও হিসাবের স্ট্রাকচারাল রিভিউ (এতে ঠিকাদারের দায় কমে না), আর SSCET এ প্রতিনিধি।<br><b>T&CD:</b> আরামকো কর্মীদের স্ক্যাফোল্ড ট্রেনিং (ঠিকাদারের কর্মীদের ট্রেনিং দেয় না), সুপারভাইজার ও ইন্সপেক্টরের সার্টিফিকেশন পরীক্ষা ও কার্ড।<br><b>LPD (এলাকা অফিসসহ):</b> প্ল্যান রিভিউ (পূর্ণতা ও SSH মানা), র‍্যান্ডম পরিদর্শন, SSCET নেতৃত্ব।<br><b>Proponent:</b> সব নিয়ম মানা নিশ্চিত করা, খোলার জানানো ও লাল ট্যাগ লাগানো, ট্যাগ-হোল্ডার-কলম সংরক্ষণ ও ইস্যুর পদ্ধতি, বদলের নির্দেশ দেওয়ার অনুমোদিত লোকের নাম ও ব্যাজ নম্বর লিখিতভাবে জানানো (নির্দেশে কী <i>প্রবেশাধিকার</i> লাগবে তা বলবে, কীভাবে বদলাবে তা নয়), বিদ্যমান কাঠামোর শক্তি নিশ্চিত করা। <b>Special ও ১২.২ m এর উপরে:</b> একজন একক যোগাযোগ ব্যক্তি, ঠিকাদারকে সব তথ্য দেওয়া (কাজের ধরন ও সময়, প্রতি লেভেলে সর্বোচ্চ কর্মী ও বাড়তি লোড, ওঠার জায়গা ও উচ্চতা, একসাথে সর্বোচ্চ কাজের ও পাট্টা-বিছানো প্ল্যাটফর্ম, বাধা ও খালি রাখার জায়গা, অস্বাভাবিক/ভারী লোড), Completeness Checklist দিয়ে যাচাই, কাজের উপযোগিতা ও ক্লিয়ারেন্স যাচাই।<br><b>Scaffold Erector:</b> ট্রেইনড স্ক্যাফোল্ডার ও সুপারভিশন দেওয়া, পরিকল্পনা-ডিজাইন-বানানো-বদল-খোলা-ইন্সপেকশন সব, ২ সপ্তাহের ইন্সপেকশন সিস্টেম চালানো, নিরাপত্তা ও কাঠামোগত যথার্থতার দায়িত্ব।<br><b>Scaffold Inspector:</b> স্বাধীনভাবে নিরাপত্তা ও নিয়ম মানা যাচাই, ৬ m এর উপরের ও নতুন/বদল হওয়া Special স্ক্যাফোল্ডে সহ-সই। ইংরেজি লেখা ও বলায় দক্ষ হতে হবে।<br><b>Scaffold Supervisor:</b> নিরাপদে ও অনুমোদিত প্ল্যান অনুযায়ী বানানো/বদল/খোলা, সব নতুন বা বদল হওয়া স্ক্যাফোল্ডে সঠিক ট্যাগ। অভিজ্ঞ ও ইংরেজি লেখা-বলায় দক্ষ হতে হবে।</p></details><details class=card><summary><b>১১. সার্টিফিকেশন (11.0)</b></summary><p>• ১ জুলাই ২০০৩ থেকে শুধু বৈধ পকেট কার্ডধারী Certified Scaffold Supervisor I, II-T বা II-S সুপারভাইজ ও ইন্সপেক্ট করতে পারে। শুধু বৈধ Certified Scaffold Inspector কার্ডধারী ইন্সপেক্ট করতে পারে (Special সহ)। <b>শুধু ইন্সপেক্টর</b> সার্টিফিকেট থাকলে বানানোর সুপারভিশন করতে পারবে না।<br>• <b>Supervisor I:</b> সব স্ক্যাফোল্ড (Special সহ) সুপারভাইজ, ইন্সপেক্ট ও ট্যাগে সই। কমপক্ষে ৫ বছর বানানোর অভিজ্ঞতা লাগে।<br>• <b>Supervisor II-T:</b> শুধু টিউব-কাপলার, ১২.২ m এর নিচে, Special ছাড়া। কমপক্ষে ৩ বছর অভিজ্ঞতা।<br>• <b>Supervisor II-S:</b> শুধু সিস্টেম বা ফেব্রিকেটেড টিউবুলার ফ্রেম (টিউবুলার ব্রেস ও টাই-ইনসহ), ১২.২ m এর নিচে, Special ছাড়া। কমপক্ষে ৩ বছর অভিজ্ঞতা।<br>• <b>Inspector:</b> সব স্ক্যাফোল্ড (Special সহ) ইন্সপেক্ট ও সই।<br>• T&CD বা LPD/T&CD অনুমোদিত বাইরের সংস্থা পরীক্ষা নেয়, পাস করলে সই করা পকেট কার্ড দেয়। একজনের একাধিক সার্টিফিকেট হতে পারে, কিন্তু একই ট্যাগে দুই জায়গায় সই করতে পারবে না।<br>• কার্ড (নাম ও ছবিসহ) সাইটে সবসময় সাথে রাখতে হবে। প্রতিষ্ঠান সার্টিফায়েডদের রেকর্ড রাখবে। সার্টিফিকেটের মেয়াদ <b>৩ বছর</b>, তারপর আবার পরীক্ষা।</p></details><details class=card><summary><b>📊 উচ্চতা অনুযায়ী দায়িত্বের ছক (Supplement 8.001-2)</b></summary><table><tr><th>উচ্চতা</th><th>প্ল্যান</th><th>Proponent+LP রিভিউ</th><th>CSD রিভিউ</th><th>বানাবে</th><th>চেকলিস্ট ও ট্যাগ সই</th></tr><tr><td>০–৬ m (০–২০ ফুট)</td><td>না</td><td>না</td><td>না</td><td>Qualified Erector</td><td>শুধু সুপারভাইজার**</td></tr><tr><td>৬–১২.২ m (২০–৪০ ফুট)</td><td>না</td><td>না</td><td>না</td><td>Qualified Erector</td><td>সুপারভাইজার + ইন্সপেক্টর</td></tr><tr><td>১২.২–৩৮ m (৪০–১২৫ ফুট)</td><td>হ্যাঁ</td><td>হ্যাঁ</td><td>না</td><td>Specialized Contractor</td><td>সুপারভাইজার + ইন্সপেক্টর</td></tr><tr><td>Special* (৩৮ m+ ধরে)</td><td>হ্যাঁ</td><td>হ্যাঁ</td><td>হ্যাঁ</td><td>Specialized Contractor</td><td>সুপারভাইজার + ইন্সপেক্টর</td></tr></table><p class=m>*Special এ আরও: ৩ m এর বেশি বাইরে বেরোনো; ৩০ m² এর বেশি প্ল্যাটফর্ম যা বিদ্যমান কাঠামো থেকে সাপোর্ট/ঝোলানো বা একই কাঠামোর আরেক স্ক্যাফোল্ডের ৩ m এর মধ্যে। **১.৮ m এর নিচে ও ট্যাগ লাগে না এমন হলে ব্যতিক্রম (3.2)।</p><p><b>Special স্ক্যাফোল্ড (2.22):</b> ৩৮ m (১২৫ ফুট) এর বেশি • SSH 9.11 এর সীমা ছাড়ানো টিউব-কাপলার • ৩ m (১০ ফুট) এর বেশি ক্যান্টিলিভার • ৩০ m² (৩২০ বর্গফুট) এর বেশি প্ল্যাটফর্ম, বিদ্যমান কাঠামো (ভবন, ছাদ, পাইপ র‍্যাক, অফশোর প্ল্যাটফর্ম) থেকে সাপোর্ট/ঝোলানো (ট্যাংক ব্র্যাকেট স্ক্যাফোল্ড বাদে) • ২৪০ kg/m² (৫০ psf) এর বেশি লোড (পাইপ, যন্ত্র, গাঁথুনি, কাঠামো ইত্যাদি, শ্রমিক ও তাদের মালামাল ছাড়া) • আউটরিগার বিম থেকে সাপোর্ট/ঝোলানো • ফ্লোটিং রুফ ট্যাংকের ওয়াইন্ড গার্ডার বা ছাদ থেকে সাপোর্ট/ঝোলানো।</p></details><details class=card><summary><b>🔁 কাজের প্রবাহ (Supplement 8.001-1)</b></summary><ol><li>Proponent স্ক্যাফোল্ডের প্রবেশ-প্রয়োজন ঠিক করে।</li><li>১২.২ m এর উপরে বা Special? <b>না</b> হলে সরাসরি বানানো (ধাপ ৭)।</li><li><b>হ্যাঁ</b>: Specialized Erector প্ল্যান বানায়, Proponent Completeness Checklist দিয়ে দেখে। গ্রহণ না হলে ঠিক করে আবার জমা।</li><li>LPD প্ল্যান রিভিউ করে। গ্রহণ না হলে Erector ঠিক করে Proponent মাধ্যমে আবার জমা।</li><li>Special হলে CSD রিভিউ করে। গ্রহণ না হলে আবার জমা।</li><li>Release for Construction এবং চূড়ান্ত প্ল্যান LPD কে।</li><li>স্ক্যাফোল্ড বানানো।</li><li>৬ m এর উপরে বা Special? <b>হ্যাঁ</b> → সুপারভাইজার <b>আর</b> ইন্সপেক্টর ফিল্ড ইন্সপেকশন। <b>না</b> → শুধু সুপারভাইজার।</li><li>পাস? <b>না</b> → কাঠামোগত বদল? হ্যাঁ ও ১২.২ m/Special হলে প্ল্যান ঠিক করে আবার জমা; নইলে Erector বদল/মেরামত করে আবার ইন্সপেকশন।</li><li>পাস → ট্যাগ লাগিয়ে ব্যবহারের জন্য ছাড়া।</li><li>Work Permit Receiver ও Issuer প্রি-ইউজ ইন্সপেকশন করে, আরামকো LPD র‍্যান্ডম ইন্সপেকশন করে। পাস → ব্যবহার চলে। ফেল → বদল/মেরামত।</li></ol></details></div>`],

home(){$("#v").innerHTML=`<div class=hero><h1>স্ক্যাফোল্ডার A to Z</h1><div>টেনে ঘুরাও, যেকোনো অংশ ছুঁয়ে দেখো 👇</div></div><div class=card id=sc3 style="padding:6px"></div>${LS.g("last")?`<div class=card onclick="go('lesson','${LS.g("last")}')"><b>▶ আগের পাঠ চালিয়ে যান</b></div>`:""}<div class=card><input id=s placeholder="🔎 সার্চ (English / বাংলা)" oninput=sr()><div id=sres></div></div><div class=card><b>আজকের টিপ</b><p>উঠার আগে Tag দেখুন; Tag না থাকলে বা Red হলে উঠবেন না।</p></div><small>Developed by MrTech · <a href="https://Mrtech.nptrunamentbd.top">Mrtech.nptrunamentbd.top</a></small>`;mount()},
lessons(){const d=done();$("#v").innerHTML=`<h3>পাঠসমূহ</h3>`+L.map(l=>`<div class=card onclick="go('lesson','${l[0]}')">${d.includes(l[0])?"✅":"📘"} ${l[1]}</div>`).join("")},
lesson(id){const i2=L.findIndex(l=>l[0]==id),l=L[i2];LS.s("last",id);const bm=LS.g("bm",[]);let b=l[2];b=id=="parts"?partsUI():id=="interview"?intvUI():b=="PIPE"?pipeUI():b=="LOAD"?loadUI():b=="INSP"?inspUI():b;$("#v").innerHTML=`<button class=xb onclick="go('lessons')">✕</button><h3>${l[1]}</h3>${lph(id)}${b[0]=="<"&&b.startsWith("<div")?b:`<div class=card>${b}</div>`}<div class=ar><button ${i2>0?`onclick="go('lesson','${L[i2-1][0]}')"`:"disabled"}>◀<small>আগে</small></button><button class="${done().includes(id)?"ok":""}" onclick="mk('${id}')">${done().includes(id)?"✅":"✔"}<small>সম্পন্ন</small></button><button onclick="bk('${id}')">${bm.includes(id)?"★":"☆"}<small>বুকমার্ক</small></button><button ${i2<L.length-1?`onclick="go('lesson','${L[i2+1][0]}')"`:"disabled"}>▶<small>পরে</small></button></div>`;if(id=="pipe")pw();if(id=="load")lc()},
lab(){$("#v").innerHTML=`<h3>3D ল্যাব</h3><div class=card id=sc3 style="padding:6px"></div>`;mount()},
quiz(){if(!E){$("#v").innerHTML=`<div class=card><h3>📝 পরীক্ষা ও অনুশীলন</h3>মোট প্রশ্ন: ${Q.length}<br>সেরা পরীক্ষার স্কোর: ${LS.g("best",0)}%</div><button class=btn onclick="qs(25,1)">🎯 পরীক্ষা (২৫ প্রশ্ন, ২০ মিনিট)</button><button class=btn onclick="qs(Q.length,0)">🔁 অনুশীলন (সব প্রশ্ন)</button><p class=m>পাস মার্ক ৬০%। প্রশ্ন ও অপশন প্রতিবার এলোমেলো হয়।</p>`;return}
if(E.i>=E.d.length){clearInterval(TI);const p=Math.round(E.sc/E.d.length*100);if(E.ex&&!E.sv){E.sv=1;const a=LS.g("scores",[]);a.push(p);LS.s("scores",a);if(p>LS.g("best",0))LS.s("best",p)}$("#v").innerHTML=`<div class=card><h3>ফলাফল: ${E.sc}/${E.d.length} (${p}%)</h3>${p>=60?"✅ পাস! ভালো হয়েছে।":"❌ আরও পড়ো, আবার চেষ্টা করো।"}</div>${E.w.length?"<b>ভুল উত্তরের পর্যালোচনা:</b>"+E.w.map(w=>`<div class=card>${w[0]}<br>✔ ${w[1]}</div>`).join(""):"<div class=card>সব সঠিক! 🎉</div>"}<button class=btn onclick="E=null;V.quiz()">আবার</button>`;return}
const q=E.d[E.i];$("#v").innerHTML=`<small>প্রশ্ন ${E.i+1}/${E.d.length} ${E.ex?`· ⏱ <b id=tm>${Math.floor(E.t/60)}:${String(E.t%60).padStart(2,"0")}</b>`:""} · সঠিক ${E.sc}</small><div class="card q"><b>${q.q}</b>${q.o.map((x,k)=>`<button onclick="an(${k},this)">${x}</button>`).join("")}</div><button class=btn onclick="clearInterval(TI);E=null;V.quiz()">✕ শেষ করো</button>`},
profile(){const d=done().length,s=LS.g("scores",[]);$("#v").innerHTML=`<div class=card><b>অগ্রগতি</b><div style="background:#8883;border-radius:8px;height:12px"><div style="width:${d/L.length*100}%;background:var(--o);height:12px;border-radius:8px"></div></div>${d}/${L.length} পাঠ সম্পন্ন<br>কুইজ স্কোর: ${s.join(", ")||"—"}<br>বুকমার্ক: ${LS.g("bm",[]).map(i=>`<a href="#" onclick="go('lesson','${i}')">${L.find(l=>l[0]==i)[1]}</a>`).join(" · ")||"—"}</div><button class=btn onclick="if(confirm('রিসেট করবেন?')){["done","chk","scores","bm","last"].forEach(k=>localStorage.removeItem(k));go('home')}">🗑 প্রোগ্রেস রিসেট</button>${admUI()}<div class=card><b>About</b><br>Scaffolder A to Z Training — Developed by MrTech<br><a href="https://Mrtech.nptrunamentbd.top">https://Mrtech.nptrunamentbd.top</a></div>`}};
function an(k,b){const q=E.d[E.i],ok=k==q.c;if(ok)E.sc++;else E.w.push([q.q,q.o[q.c]]);b.style.background=ok?"#2a9d4a":"#d33";b.style.color="#fff";document.querySelectorAll(".q button").forEach((x,n)=>{x.disabled=true;if(n==q.c)x.style.outline="2px solid #2a9d4a"});setTimeout(()=>{if(!E)return;E.i++;if(cur=="quiz")V.quiz()},900)}
let E=null,TI=0;const shf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function qs(n,ex){const d=shf(Q).slice(0,n).map(q=>{const o=shf([0,1,2]);return{q:q[0],o:o.map(i=>q[1+i]),c:o.indexOf(q[4])}});E={d,i:0,sc:0,w:[],ex,t:ex?1200:0};clearInterval(TI);if(ex)TI=setInterval(()=>{if(!E)return clearInterval(TI);E.t--;const e=$("#tm");if(e)e.textContent=Math.floor(E.t/60)+":"+String(E.t%60).padStart(2,"0");if(E.t<=0){E.i=E.d.length;if(cur=="quiz")V.quiz()}},1000);V.quiz()}
function mk(id){const d=new Set(done());d.add(id);LS.s("done",[...d]);go("lessons")}
function bk(id){let b=LS.g("bm",[]);b=b.includes(id)?b.filter(x=>x!=id):[...b,id];LS.s("bm",b);go("lesson",id)}
function sr(){const t=$("#s").value.toLowerCase().trim(),r=t?L.filter(l=>(l[1]+l[2]).toLowerCase().includes(t)):[];const pr=t?P.filter(p=>p.join(" ").toLowerCase().includes(t)):[];$("#sres").innerHTML=pr.map(p=>`<p onclick="go('lesson','parts')">🔩 ${p[0]} (${p[1]})</p>`).join("")+r.map(l=>`<p onclick="go('lesson','${l[0]}')">📘 ${l[1]}</p>`).join("")}
addEventListener("popstate",()=>{if(cur=="lesson")go("lessons")});
document.addEventListener("click",()=>{const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen({navigationUI:"hide"}).catch(()=>{})},{once:true});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
go("home");
setTimeout(()=>{const p=$("#sp");p.style.opacity=0;setTimeout(()=>p.remove(),500)},900);
</script></body></html>
